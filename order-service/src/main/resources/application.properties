spring.application.name=order-service
server.port=8083

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/fashion_order_db
spring.datasource.username=root
spring.datasource.password=${ORDER_DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Microservice URLs
services.product.url=http://localhost:8081
services.inventory.url=http://localhost:8082

# Keycloak JWT Authentication
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/fashion-commerce


# Keycloak service-to-service authentication
services.auth.token-url=http://localhost:8080/realms/fashion-commerce/protocol/openid-connect/token
services.auth.client-id=fashion-order-service
services.auth.client-secret=${ORDER_SERVICE_CLIENT_SECRET}
